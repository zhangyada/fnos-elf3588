# =============================================================================
# Build ELF3588 FnOS Image (Data10G Variant) — 数据版镜像
#
# 基于标准版构建产物（build.yml 的 elf3588-<date> Release），把 rootfs 缩小
# DATA_GB（默认 10）GiB，磁盘尾部留出对应未分配空间，供飞牛创建存储空间。
#
# 触发：
#   - 标准版 workflow 成功后自动跟跑（workflow_run）→ 每次上游更新自动出两个镜像
#   - 手动触发（workflow_dispatch）→ 基于最新标准版资产构建
#
# 产出：fnnas_rockchip_elf3588_d10g_k<ver>_<date>.img.gz
# 发布：独立 Release tag elf3588-d10g-<date>（与标准版隔离，避免并发写冲突）
# =============================================================================
name: ELF3588 FnOS 数据版镜像（系统12G+数据自适应）

"on":
  workflow_run:
    workflows: ["Build ELF3588 FnOS Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（忽略防重复，用于方案升级后重建）"
        type: boolean
        default: false

permissions:
  contents: write                # 需要：创建/更新 Release
  issues: write                  # 需要：失败时发诊断到 issue

concurrency:
  group: fnos-elf3588-data10g
  cancel-in-progress: false

jobs:
  shrink:
    name: 构建数据版镜像
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 查找并下载最新标准版镜像
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取最新非 d10g 的标准版 Release（tag 形如 elf3588-YYYY.MM.DD）
          # 注意：gh release list 默认按创建时间排序，06.25 后建会在前；
          #       必须按 tagName（日期）字典序取最新，才能拿到最新镜像版本
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName 2>/dev/null | python3 -c "
          import json, sys
          rels = json.load(sys.stdin)
          tags = sorted([r['tagName'] for r in rels
                         if r['tagName'].startswith('elf3588-') and '-d10g-' not in r['tagName']],
                        reverse=True)
          print(tags[0] if tags else '')
          ")
          [ -n "$tag" ] || { echo "错误: 未找到标准版 Release（先跑标准版构建）"; exit 1; }
          echo "使用标准版 Release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p work10g
          gh release download "$tag" \
            --pattern 'fnnas_rockchip_elf3588_*.img.gz' \
            --repo "$GITHUB_REPOSITORY" --dir work10g --clobber
          ls -lh work10g/

      - name: 解析版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          F=$(ls work10g/fnnas_rockchip_elf3588_*.img.gz | head -1)
          BASE=$(basename "$F" .img.gz)
          # 形如 fnnas_rockchip_elf3588_k6.18.18_2026.06.25
          KVER=$(echo "$BASE" | sed -E 's/.*_k([0-9.]+)_.*/\1/')
          DATE=$(echo "$BASE" | sed -E 's/.*_k[0-9.]+_([0-9.]+)$/\1/')
          echo "内核: $KVER | 日期: $DATE"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # 防重复：数据版 tag 已存在（上游镜像未变化）则跳过后续步骤；force=true 时跳过检查
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force=true，跳过防重复检查，强制重建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            TAG="elf3588-d10g-$DATE"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::数据版 $TAG 已存在（上游镜像未变化），跳过本次构建"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 安装分区工具
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs parted
        # 注: 镜像保持 6.6G 小体积，不 truncate；烧录后由 fnnas-tf 按 fnnas.conf 扩到 12G

      - name: 改造扩展机制（掐死 99% 脚本，fnnas.conf 限 ${ROOTFS_GIB}G）并重新打包
        if: steps.ver.outputs.skip != 'true'
        env:
          DATE: ${{ steps.ver.outputs.date }}
          KERNEL_VERSION: ${{ steps.ver.outputs.kver }}
          ROOTFS_GIB: "12"        # 系统分区目标大小（GiB），写进 fnnas.conf
          PREINSTALL: "yes"       # 预装 XFCE 桌面 + XRDP + python3-tk + aiohttp（qemu chroot）
        run: |
          cd work10g
          chmod +x ../scripts/shrink-data10g.sh
          set +e
          ../scripts/shrink-data10g.sh 2>&1 | tee shrink.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::shrink 脚本失败 (exit $RC)，最后 20 行："
            tail -20 shrink.log | sed 's/^/::error::/'
            exit $RC
          fi

      - name: 失败诊断发布到 issue（完整日志，公开可查）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 数据版构建失败诊断 (run ${{ github.run_id }})"
            echo ""
            echo '```'
            if [ -f work10g/shrink.log ]; then
              tail -80 work10g/shrink.log
            else
              echo "（shrink.log 不存在，步骤可能在更早阶段失败）"
            fi
            echo '```'
          } > diag.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[自动] 数据版构建失败 run ${{ github.run_id }}" \
            --body-file diag.md || true

      - name: 发布到 GitHub Release (elf3588-d10g-<date>)
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |-
            小镜像方案（解压仅 ~6.6G，烧写快）：
            - 镜像原样打包，不拉大体积
            - 掐死飞牛 99% 扩展脚本（resize-rootfs.sh 改名）
            - 保留 fnnas-tf（遵守配置）：首启自动把 rootfs 扩到 12G
            - fnnas.conf: rootfs_limit_gib=12

            **已预装（开箱即用，无需手动安装）**：
            - XFCE 桌面 + XRDP + 中文字体（Debian 12，中文 locale）
            - python3-tk
            - aiohttp（pip，--break-system-packages）

            烧录后 rootfs 自动扩到 12G 并固定，剩余空间全部未分配（自适应盘容量）：
            - 32G eMMC → 约 17G 数据空间
            - 128G 存储 → 约 116G 数据空间
            可在「设置 → 存储空间管理 → 创建存储空间」使用。

            - 基础: ${{ steps.find.outputs.tag }}
            - 内核: k${{ steps.ver.outputs.kver }}
            - 烧写: 解压 *.img.gz 后用瑞芯微开发工具（.img + MiniLoaderAll.bin）或 dd 写入

            校验：sha256sum -c SHA256SUMS
        run: |
          cd out10g
          TAG="elf3588-d10g-${{ steps.ver.outputs.date }}"
          TITLE="ELF3588 FnOS (系统12G+数据自适应) k${{ steps.ver.outputs.kver }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已存在：更新标题/描述（gh create 不会改已有 release 的 title/body）
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$TAG" SHA256SUMS *.img.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" SHA256SUMS *.img.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$RELEASE_NOTES"
          fi
