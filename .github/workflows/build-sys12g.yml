# =============================================================================
# Build ELF3588 FnOS Image (Sys12G Variant) — 数据版镜像（系统 12G + 数据自适应）
#
# 基于标准版构建产物（build.yml 的 elf3588-<date> Release），改造扩展机制：
#   停用越权扩展脚本（resize-rootfs.sh），保留 fnnas-tf（遵守配置）
#   首启把 rootfs 扩到 12G；镜像保持小体积；预装桌面/软件（可选）。
#
# 触发：
#   - 标准版 workflow 成功后自动跟跑（workflow_run）→ 每次上游更新自动出两个镜像
#   - 手动触发（workflow_dispatch）→ 基于最新标准版资产构建
#
# 产出：fnnas_rockchip_elf3588_sys12g_k<ver>_<date>.img.gz
# 发布：独立 Release tag elf3588-sys12g-<date>（与标准版隔离，避免并发写冲突）
# =============================================================================
name: ELF3588 FnOS 数据版镜像（系统12G+数据自适应）

"on":
  workflow_run:
    workflows: ["Build ELF3588 FnOS Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建（忽略防重复，用于方案升级后重建）"
        type: boolean
        default: false

permissions:
  contents: write                # 需要：创建/更新 Release
  issues: write                  # 需要：失败时发诊断到 issue

concurrency:
  group: fnos-elf3588-sys12g
  cancel-in-progress: false

jobs:
  shrink:
    name: 构建数据版镜像
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 查找并下载最新标准版镜像
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 查询上游 ophub/fnnas 最新 release，确定 orangepi-5-plus 当前提供的最新镜像。
          # 不能按日期字典序选 tag：上游切换内核后（6.18 -> 6.12 LTS），新镜像日期
          # 可能比旧内核镜像更早（如 6.12.41_06.25 < 6.18.18_07.12），按日期会选到旧内核。
          # 这里直接对齐上游当前提供的镜像，再下载对应的标准版产物。
          UP=$(python3 scripts/latest-upstream.py 2>/dev/null || true)
          KVER=$(echo "$UP" | awk '{print $1}')
          DATE=$(echo "$UP" | awk '{print $2}')
          if [ -n "$DATE" ]; then
            TAG="elf3588-$DATE"
            IMG="fnnas_rockchip_elf3588_k${KVER}_${DATE}.img.gz"
            echo "上游最新镜像: k$KVER ($DATE) -> 标准版 $IMG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            mkdir -p work10g
            gh release download "$TAG" --pattern "$IMG" \
              --repo "$GITHUB_REPOSITORY" --dir work10g --clobber \
              || gh release download "$TAG" --pattern 'fnnas_rockchip_elf3588_*.img.gz' \
              --repo "$GITHUB_REPOSITORY" --dir work10g --clobber
          else
            # 兜底：上游查询失败时，按日期排序选最新标准版 tag
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
              --json tagName 2>/dev/null | python3 -c "
            import json, re, sys
            rels = json.load(sys.stdin)
            tags = sorted([r['tagName'] for r in rels
                           if re.fullmatch(r'elf3588-\\d{4}\\.\\d{2}\\.\\d{2}', r['tagName'])],
                          reverse=True)
            print(tags[0] if tags else '')
            ")
            [ -n "$TAG" ] || { echo "错误: 未找到标准版 Release（先跑标准版构建）"; exit 1; }
            echo "兜底使用标准版 Release: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            mkdir -p work10g
            gh release download "$TAG" --pattern 'fnnas_rockchip_elf3588_*.img.gz' \
              --repo "$GITHUB_REPOSITORY" --dir work10g --clobber
          fi
          ls -lh work10g/

      - name: 解析版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          F=$(ls work10g/fnnas_rockchip_elf3588_*.img.gz | head -1)
          BASE=$(basename "$F" .img.gz)
          # 形如 fnnas_rockchip_elf3588_k6.18.18_2026.06.25
          KVER=$(echo "$BASE" | sed -E 's/.*_k([0-9.]+)_.*/\1/')
          DATE=$(echo "$BASE" | sed -E 's/.*_k[0-9.]+_([0-9.]+)$/\1/')
          echo "内核: $KVER | 日期: $DATE"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          # 防重复：数据版 tag 里已有同内核镜像则跳过；force=true 时跳过检查
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force=true，跳过防重复检查，强制重建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            TAG="elf3588-sys12g-$DATE"
            SYSIMG="fnnas_rockchip_elf3588_sys12g_k${KVER}_${DATE}.img.gz"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
               && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null | grep -q "$SYSIMG"; then
              echo "::notice::数据版 $SYSIMG 已存在，跳过本次构建"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 安装分区工具
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs btrfs-progs parted
        # 注: 镜像保持 6.6G 小体积，不 truncate；烧录后由 fnnas-tf 按 fnnas.conf 扩到 12G

      - name: 改造扩展机制（停用越权脚本，fnnas.conf 限 ${ROOTFS_GIB}G）并重新打包
        if: steps.ver.outputs.skip != 'true'
        env:
          DATE: ${{ steps.ver.outputs.date }}
          KERNEL_VERSION: ${{ steps.ver.outputs.kver }}
          ROOTFS_GIB: "12"        # 系统分区目标大小（GiB），写进 fnnas.conf
          PREINSTALL: "yes"       # 预装 XFCE 桌面 + XRDP + python3-tk + aiohttp（qemu chroot）
        run: |
          cd work10g
          chmod +x ../scripts/shrink-data10g.sh
          set +e
          ../scripts/shrink-data10g.sh 2>&1 | tee shrink.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::shrink 脚本失败 (exit $RC)，最后 20 行："
            tail -20 shrink.log | sed 's/^/::error::/'
            exit $RC
          fi

      - name: 失败诊断发布到 issue（完整日志，公开可查）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 数据版构建失败诊断 (run ${{ github.run_id }})"
            echo ""
            echo '```'
            if [ -f work10g/shrink.log ]; then
              tail -80 work10g/shrink.log
            else
              echo "（shrink.log 不存在，步骤可能在更早阶段失败）"
            fi
            echo '```'
          } > diag.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[自动] 数据版构建失败 run ${{ github.run_id }}" \
            --body-file diag.md || true

      - name: 发布到 GitHub Release (elf3588-sys12g-<date>)
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |-
            小镜像方案（解压仅 ~6.6G，烧写快）：
            - 镜像原样打包，不拉大体积
            - 停用飞牛越权扩展脚本（resize-rootfs.sh 改名）
            - 保留 fnnas-tf（遵守配置）：首启自动把 rootfs 扩到 12G
            - fnnas.conf: rootfs_limit_gib=12

            **已预装（开箱即用，无需手动安装）**：
            - XFCE 桌面 + XRDP + 中文字体（Debian 12，中文 locale）
            - python3-tk
            - aiohttp（pip，--break-system-packages）

            烧录后 rootfs 自动扩到 12G 并固定，剩余空间全部未分配（自适应盘容量）：
            - 32G eMMC → 约 17G 数据空间
            - 128G 存储 → 约 116G 数据空间
            可在「设置 → 存储空间管理 → 创建存储空间」使用。

            - 基础: ${{ steps.find.outputs.tag }}
            - 内核: k${{ steps.ver.outputs.kver }}
            - 烧写: 解压 *.img.gz 后用瑞芯微开发工具（.img + MiniLoaderAll.bin，均已随本 Release 附带）或 dd 写入

            校验：sha256sum -c SHA256SUMS
        run: |
          cd out10g
          # 把 MiniLoaderAll.bin（Loader）一并附到 Release，供 eMMC 烧写
          cp "$GITHUB_WORKSPACE/assets/MiniLoaderAll.bin" .
          (cd "$GITHUB_WORKSPACE/assets" && sha256sum MiniLoaderAll.bin) >> SHA256SUMS
          TAG="elf3588-sys12g-${{ steps.ver.outputs.date }}"
          TITLE="ELF3588 FnOS (系统12G+数据自适应) k${{ steps.ver.outputs.kver }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已存在：更新标题/描述（gh create 不会改已有 release 的 title/body）
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$RELEASE_NOTES"
            # 合并旧 SHA256SUMS，避免 --clobber 覆盖丢失历史镜像的校验值
            mkdir -p .oldsums
            gh release download "$TAG" --pattern 'SHA256SUMS' \
              --repo "$GITHUB_REPOSITORY" --dir .oldsums --clobber >/dev/null 2>&1 || true
            if [ -f .oldsums/SHA256SUMS ]; then
              cat .oldsums/SHA256SUMS >> SHA256SUMS
              awk '!seen[$2]++' SHA256SUMS > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS
            fi
            gh release upload "$TAG" SHA256SUMS MiniLoaderAll.bin *.img.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" SHA256SUMS MiniLoaderAll.bin *.img.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$RELEASE_NOTES"
          fi
